services:
  postgres:
    image: postgres:16-alpine
    container_name: smartattend-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartattend
    ports:
      - "5432:5432"
    volumes:
      - smartattend_pgdata:/var/lib/postgresql/data

volumes:
  smartattend_pgdata:
