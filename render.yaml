services:
  - type: web
    name: smartattend
    runtime: node
    plan: free
    region: singapore
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: smartattend-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: smartattend-db
    databaseName: smartattend
    user: smartattend
    plan: free
    region: singapore
    postgresMajorVersion: 16
